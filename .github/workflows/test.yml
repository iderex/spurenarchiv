# The test check (#5). It runs the suite under `tool/`.
#
# The string `test` is the interface, chosen once here. `build.yml` carries the
# reasoning for the job id and the job name being the same string, for the
# matrix hazard that would move the reported name without anybody renaming
# anything, and for the trigger being `pull_request` alone.
#
# `--locked` rather than a plain run, so a suite that only passes against a
# dependency graph nobody committed reddens here instead of on the machine of
# whoever clones next.
#
# What this check does not carry: `docs/testing.md` states three constraints on
# the suite, no display, no elevation and no network, and nothing refuses a
# violation of any of them today. A test that opens a socket lands exactly as
# quietly under this check as one that does not. That is #7 and it is not made
# any less open by the suite now having somewhere to run.
name: test

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tool

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned toolchain, printed rather than assumed
        run: |
          set -euo pipefail
          rustc --version
          cargo --version

      # #7 asks that the suite pass on a machine with no display and under an
      # unprivileged account. What a run leaves behind otherwise is a green tick
      # and somebody's belief about the image it ran on, and reading a property
      # off an image's documentation is not reading it off the run. These four
      # lines are what makes the run itself the evidence. None of them asks for
      # a privilege, opens a window or touches the network.
      - name: The machine the suite is about to run on
        run: |
          set -euo pipefail
          echo "DISPLAY=${DISPLAY:-unset} WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-unset}"
          echo "X11 sockets present: $(ls -1 /tmp/.X11-unix 2>/dev/null | wc -l)"
          echo "account: $(id -un), uid $(id -u), groups $(id -Gn)"
          echo "whether this account could become root by asking was not read, because reading it means asking"

      - name: Run the suite
        run: cargo test --locked
