[package]
name = "spurenarchiv-validator"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.0"
publish = false

# The library is the whole of the judgement and the binary is a thin layer over
# it. Issue #36 asks for a command and a library that cannot disagree, and the
# cheapest way to keep that promise is for there to be one implementation from
# the first change rather than a second one grown later.
[lib]
name = "spurenarchiv_validator"
path = "src/lib.rs"

# The name an operator types is entry 8 of issue #1 and is open, so this target
# name is what the build produces today and not an answer to that entry.
[[bin]]
name = "deposit-validator"
path = "src/main.rs"

# The generator behind examples/synthetic, and a second target rather than a
# mode of the one above: a depositor runs the validator against their own
# deposit and has no reason to carry something that writes this repository's
# example over it. Issue #42 asks for the generator to be tracked so that the
# example can be regenerated and compared rather than trusted.
[[bin]]
name = "synthetic-example"
path = "src/bin/synthetic_example.rs"

[dependencies]
# The schema is the normative artefact, so the validator evaluates it rather
# than reimplementing the conditions in Rust. A second implementation of the
# refusal set is the state docs/decisions/schema-language.md exists against.
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }

[profile.release]
# A depositor downloads one file. Nothing here needs the symbols and they are
# most of the size.
strip = true
